<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORMA</title>
  <meta name="description" content="Replication package for architectural verifiability in agent-to-agent systems.">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e8;
      --ink: #1c1915;
      --muted: #5e584e;
      --line: #cfc6b8;
      --accent: #8c3d2f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-weight: 400;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 4rem;
    }
    p.kicker {
      margin: 0 0 1.25rem;
      color: var(--accent);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 6.4rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .rule {
      width: 7.5rem;
      height: 1px;
      margin: 1.6rem 0 1.4rem;
      background: var(--ink);
      transform-origin: left center;
    }
    .lede {
      margin: 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1.45;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 2.4rem;
    }
    a {
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.92rem;
      text-underline-offset: 0.28em;
    }
    a:hover { color: var(--accent); }
    footer {
      margin-top: 4.5rem;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.78rem;
    }
    @media (prefers-reduced-motion: no-preference) {
      .kicker, h1, .rule, .lede, nav, footer {
        animation: rise 700ms ease both;
      }
      h1 { animation-delay: 80ms; }
      .rule {
        animation-name: draw;
        animation-duration: 900ms;
        animation-delay: 180ms;
      }
      .lede { animation-delay: 280ms; }
      nav { animation-delay: 400ms; }
      footer { animation-delay: 520ms; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes draw {
      from { opacity: 0; transform: scaleX(0); }
      to { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Replication package</p>
    <h1>FORMA</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">Architectural verifiability for agent-to-agent systems. The code, the FORMA-Bench dataset, and the retained evaluation records are in this repository.</p>
    <nav>
      <a href="https://github.com/ResearchAnonymized/FORMA/blob/main/BENCHMARK.md">Use FORMA-Bench</a>
      <a href="https://github.com/ResearchAnonymized/FORMA">Read the repository</a>
      <a href="https://github.com/ResearchAnonymized/FORMA/blob/main/README.md">Run the checks</a>
    </nav>
    <footer>ICSA replication package</footer>
  </main>
</body>
</html>
